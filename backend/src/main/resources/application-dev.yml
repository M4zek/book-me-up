# Database information
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/book_me_up_test?serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  jackson:
    time-zone: Europe/Warsaw

# JSON Web Encryption token information
jwe:
  token:
    expirationSec: 360            # 360 = 5 min sec
    refreshExpirationSec: 1800    # 1800 = 30 min
    header: Authorization
    prefix: Bearer

app:
  cors:
    allowed-origins: http://localhost:4200, http://127.0.0.1:4200