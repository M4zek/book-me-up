# Database information
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/book_me_up_test?serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  jackson:
    time-zone: Europe/Warsaw

# JSON Web Encryption token information
jwe:
  token:
    expirationSec: 30         # 30 = 30 sec
    refreshExpirationSec: 60    # 60 = 1 min
    header: Authorization
    prefix: Bearer