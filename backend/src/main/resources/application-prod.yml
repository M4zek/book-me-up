
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/book_me_up?serverTimezone=UTC
    username: admin_db
    password: admin_password_db
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  jackson:
    time-zone: Europe/Warsaw

# JSON Web Encryption token information
jwe:
  token:
    expirationSec: 600         # 600 = 10 min
    refreshExpirationSec: 1800    # 1800 = 30 min
    header: Authorization
    prefix: Bearer