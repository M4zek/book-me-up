
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/book_me_up?serverTimezone=UTC
    username: admin_db
    password: admin_password_db
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  jackson:
    time-zone: Europe/Warsaw
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

# JSON Web Encryption token information
jwe:
  token:
    expirationSec: 600         # 600 = 10 min
    refreshExpirationSec: 1800    # 1800 = 30 min
    header: Authorization
    prefix: Bearer

app:
  cors:
    allowed-origins: http://localhost:4200, http://127.0.0.1:4200, wss://m4zek.com.pl, https://m4zek.com.pl