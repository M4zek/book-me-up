<div class="sidebar">

    <button class="toggle-btn" (click)="toggle.emit()">
        <div class="btn-txt"
            [class.rotated]="collapsed"
        > {{ collapsed ? '☰' : 'X'}}</div>
    </button>

    <ul class="nav-list">
        <li *ngFor="let nav of NAVIGATION">
            <a [routerLink]="nav.path"
                [class.active]="router.url == nav.path">
                <div class="img-con">
                    <img class="icon" [src]="nav.icon" alt="img"/>
                </div>
                <div class="nav-text" [class.hidden]="collapsed">
                    <span class="text">
                        {{nav.name}}
                    </span>
                </div>
            </a>
        </li>
    </ul>
</div>
