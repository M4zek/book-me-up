<div class="company-container">
    <div class="left-container">
        <app-image-list [imageList]="portfolioItems"></app-image-list>
        <div class="horizontal-container">
            <div class="vertical-container">
                <p class="company-name-paragraph">{{company.name}}</p>
                <p class="company-address-paragraph">{{getStringAddress()}}</p>
            </div>
            <div class="icon-container">
                <svg class="share" width="23" height="30" viewBox="0 0 23 30" fill="none" (click)="shareCompany()">
                    <path d="M17.9736 1.63232C20.0502 1.63257 21.875 3.49234 21.875 5.96826C21.8749 8.44408 20.0501 10.3039 17.9736 10.3042C17.078 10.3042 16.2457 9.9681 15.5762 9.38721L14.9941 8.88232L14.3574 9.31592L9.125 12.8755L8.5752 13.2495L8.70703 13.9019C8.83526 14.5334 8.83524 15.1883 8.70703 15.8198L8.5752 16.4722L9.125 16.8462L14.3574 20.4058L14.9941 20.8394L15.5762 20.3345C16.2457 19.7537 17.078 19.4185 17.9736 19.4185C20.0501 19.4187 21.8748 21.2777 21.875 23.7534C21.875 26.2293 20.0502 28.0891 17.9736 28.0894C15.8969 28.0894 14.0713 26.2295 14.0713 23.7534C14.0712 23.4307 14.104 23.1088 14.168 22.7944L14.2998 22.1431L13.75 21.769L8.51758 18.2085L7.88086 17.7759L7.29883 18.2798C6.62929 18.8607 5.79709 19.1968 4.90137 19.1968C2.82482 19.1965 1 17.3368 1 14.8608C1.00005 12.385 2.82485 10.5252 4.90137 10.5249C5.79704 10.5249 6.6293 10.861 7.29883 11.4419L7.88086 11.9468L8.51758 11.5132L13.75 7.95361L14.2998 7.57861L14.168 6.92725C14.1053 6.61914 14.0713 6.2983 14.0713 5.96826C14.0713 3.49217 15.8969 1.63232 17.9736 1.63232Z" stroke="white" stroke-width="2"/>
                </svg>

                <svg class="heart" stroke="white" fill="none" viewBox="0 0 25 26" (click)="likeCompany()">
                    <path d="M14.2236 4.01538C16.3635 1.50217 19.6782 1.19612 21.877 3.32788V3.32886C24.4696 5.84773 24.6973 10.3827 22.5098 13.2468L22.291 13.5183L12.8428 24.6238C12.7166 24.772 12.5887 24.8093 12.498 24.8093C12.4075 24.8093 12.2803 24.7716 12.1543 24.6238L2.70605 13.5183H2.70508C0.366692 10.7655 0.441084 6.22365 2.88086 3.57886L3.12402 3.32886C5.32318 1.19606 8.64174 1.50327 10.7764 4.01538L10.7773 4.01636L11.7393 5.14429L12.501 6.03687L13.2617 5.14429L14.2236 4.01636V4.01538Z"/>
                </svg>
            </div>
        </div>
        <div class="parent">
            <app-double-spinner [text]="'Company offer loading'" *ngIf="!requestCompanyOfferSuccess"/>
            <app-company-offer-list
                    *ngIf="requestCompanyOfferSuccess"
                    [offerItems]="offerItems"
                    [companyId]="company.id"
            />
            <app-paginator
                    *ngIf="requestCompanyOfferSuccess"
                    [pagination]="pagination"
                    (paginatorChanged)="onPaginatorOfferChanged()"/>
        </div>
    </div>

    <div class="right-container">
        <div class="company-address-map">
            <app-map [currentAddress]="companyAddress"/>
        </div>
        <div class="company-description">
            <p class="title-paragraph">About us</p>
            <p class="company-desc-paragraph">{{this.company.description}}</p>
        </div>
        <app-company-employee-list [companyEmployees]="company.employees"></app-company-employee-list>
        <app-company-business-hours [openingHours]="company.companyHours"></app-company-business-hours>
        <app-company-opinions [companyId]="company_id" [opinionsDetails]="company.reviewStatistics"></app-company-opinions>
    </div>
</div>
