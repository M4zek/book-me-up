<div class="dropdown-container"
     [class.disabled]="disabled"
>
    <img [src]="'data:image/jpeg;base64,' + selectedOption.image" alt="img" *ngIf="selectedOption.image" class="icon">

    <input
       class="selected-input"
       disabled
       [(ngModel)]="selectedOption.content"
       placeholder="{{placeholder}}"/>

    <img [ngClass]="{ 'up': menuOpen }" [src]="'icons/drop_down_arrow.png'" (click)="toggleMenu()" alt="Drop down" class="drop-down-icon"/>
</div>

<ul class="dropdown-menu" *ngIf="menuOpen" [class.disabled]="disabled">
    <li class="item" *ngFor="let item of options" (click)="select(item)">
        <img [src]="'data:image/jpeg;base64,' + item.image" alt="img" *ngIf="item.image" class="icon">
        <p class="item-text"
           [ngClass]="item.id==selectedOption.id ? 'sel' : ''">{{item.content}}</p>
    </li>
</ul>
