<div class="modal-backdrop" *ngIf="isVisible" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <form class="edit-container">
            <textarea type="text"
                      [(ngModel)]="description"
                      name="desc"
                      maxlength="2048"
                      [value]="description"></textarea>
        </form>
        <span class="txt-size"
              [style.color]="textColor"
        >{{this.description.length}} / 2048</span>
        <div class="edit-container-buttons">
            <div class="btn-container"
                [class.disabled]="(this.description === this.descriptionCopy) || this.description.length < 10">
                <img [src]="'icons/confirm_icon.svg'" alt="confirm" (click)="confirmEdit()"/>
            </div>
            <div class="btn-container" (click)="close()">
                <img [src]="'icons/reject_icon.svg'" alt="close"/>
            </div>
        </div>
    </div>
</div>
