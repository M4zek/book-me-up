<div class="modal-backdrop" *ngIf="isVisible" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">

        <h2>Edit business hours</h2>

        <div class="days-grid">
            <div class="day-card"
                 *ngFor="let day of days"
                 [class.closed] = "day.closed">
                <h3>{{ day.name }}</h3>

                <label class="checkbox-wrapper">
                    <input type="checkbox" class="sc-gJwTLC ikxBAC" [(ngModel)]="day.closed" />
                </label>

                <div class="time-group" [class.disabled]="day.closed">
                    <div class="time-block">
                        <label>From</label>
                        <div class="time-inputs">
                            <div class="time-control">
                                <button (click)="adjustTime(day, 'openHour', 1)" [disabled]="day.closed">▲</button>
                                <span>{{ day.openHour | number:'2.0' }}</span>
                                <button (click)="adjustTime(day, 'openHour', -1)" [disabled]="day.closed">▼</button>
                            </div>
                            <span class="white">:</span>
                            <div class="time-control">
                                <button (click)="adjustTime(day, 'openMinute', 5)" [disabled]="day.closed">▲</button>
                                <span>{{ day.openMinute | number:'2.0' }}</span>
                                <button (click)="adjustTime(day, 'openMinute', -5)" [disabled]="day.closed">▼</button>
                            </div>
                        </div>
                    </div>

                    <div class="time-block">
                        <label>To</label>
                        <div class="time-inputs">
                            <div class="time-control">
                                <button (click)="adjustTime(day, 'closeHour', 1)" [disabled]="day.closed">▲</button>
                                <span>{{ day.closeHour | number:'2.0' }}</span>
                                <button (click)="adjustTime(day, 'closeHour', -1)" [disabled]="day.closed">▼</button>
                            </div>
                            <span class="white">:</span>
                            <div class="time-control">
                                <button (click)="adjustTime(day, 'closeMinute', 5)" [disabled]="day.closed">▲</button>
                                <span>{{ day.closeMinute | number:'2.0' }}</span>
                                <button (click)="adjustTime(day, 'closeMinute', -5)" [disabled]="day.closed">▼</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div class="edit-container-buttons">
            <div class="btn-container dark-bg"
                 (click)="confirmEdit()">
                <img [src]="'icons/confirm_icon.svg'" alt="search" />
                <div class="expand">
                    <p class="btn-text white">Confirm</p>
                </div>
            </div>


            <div class="btn-container" (click)="close()">
                <img [src]="'icons/reject_icon.svg'" alt="close" />
                <div class="expand">
                    <p class="btn-text">Close</p>
                </div>
            </div>
        </div>
    </div>
</div>
