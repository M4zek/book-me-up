<div class="modal-backdrop" *ngIf="isVisible" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="top">
            <app-my-img [src]="inputData?.companyLogo" [type]="FileType.IMG_COMPANY_LOGO" [alt]="'logo'"/>
            <div class="name-cont">
                <span>{{ inputData?.companyNameToReview }}</span>
                <span>{{ inputData?.offerToReview?.name }}</span>
            </div>
        </div>
        <form [formGroup]="reviewForm">

            <div class="rating-input"
                [class.invalid]="reviewForm.controls.rating.invalid"
                >

                <app-rating-stars
                        (ratingChanged)="onRatingChange($event)"
                        [isEditing]="true"/>
            </div>

            <div class="opinion-content"
                 [class.invalid]="reviewForm.controls.comment.invalid"
            >
            <textarea
                    formControlName="comment"
                    [maxLength]="MAX_COMMENT_LENGTH"
                    placeholder="Write your opinion here..."></textarea>
                <span class="length-textarea">
                    {{reviewForm.controls.comment.value ? reviewForm.controls.comment.value.length : '0'}} / {{MAX_COMMENT_LENGTH}}
                </span>
            </div>
        </form>

        <div class="button"
             [class.disabled]="reviewForm.invalid"
            (click)="confirm()">
            <span>Confirm</span>

        </div>
    </div>
</div>
