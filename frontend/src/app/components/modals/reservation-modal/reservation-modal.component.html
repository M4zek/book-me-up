<div class="modal-backdrop" *ngIf="isVisible" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <app-date-reservation-picker (changeDate)="onDateChange($event)"
                                     [companyId]="companyId"
                                     [duration]="offer.duration"/>
        <div class="white-line"></div>
        <div class="user-reservation-information">
            <div class="user-data">
                <img [src]="'icons/user_icon.svg'" alt="icon"/>
                <input [value]="userData.firstName" placeholder="First name" class="input-con" disabled>
            </div>
            <div class="user-data">
                <img [src]="'icons/user_icon.svg'" alt="icon"/>
                <input [value]="userData.lastName" placeholder="Last name" class="input-con" disabled>
            </div>
            <div class="user-data">
                <img [src]="'icons/phone_icon.svg'" alt="icon"/>
                <input [value]="userData.phoneNumber" placeholder="Phone number" class="input-con" disabled>
            </div>
            <div class="user-data">
                <img [src]="'icons/envelope_icon.svg'" alt="icon"/>
                <input [value]="userData.email" placeholder="Email" class="input-con" disabled>
            </div>
        </div>
        <div class="white-line"></div>
        <div class="offer-reservation-information">
            <div class="horizontal-info-container">
                <p class="offer-name">{{offer.name}}</p>
                <div class="vertical-container-information">
                    <p class="price">{{offer.price}} PLN</p>
                    <p class="time">{{offer.duration}} min</p>
                </div>
            </div>
            <div class="white-line-25"></div>
            <app-drop-down-list
                    [options]="preferredEmployees"
                    [placeholder]="'Preferred employee'"
                    (valueChanged)="changePreferredEmployee($event)"></app-drop-down-list>
        </div>
        <div class="white-line"></div>
        <div class="reservation-summary">
            <div class="summary-content">
                <p class="title-summary">Date:</p>
                <p class="summary-par">{{startDate}}</p>
            </div>
            <div class="summary-content">
                <p class="title-summary">Price:</p>
                <p class="summary-par">{{offer.price}} PLN</p>
            </div>
            <div class="summary-content">
                <p class="title-summary">Time:</p>
                <p class="summary-par">{{ offer.duration }} min</p>
            </div>
        </div>
        <div class="checkbox-container">
            <input type="checkbox" class="checkbox">
            <p>I confirm the registration details</p>
        </div>
        <div class="btn-confirm" (click)="confirmReservation()">
            <p>Confirm reservation</p>
        </div>
    </div>
</div>
