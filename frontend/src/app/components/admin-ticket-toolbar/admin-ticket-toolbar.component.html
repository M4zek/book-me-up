        <div class="multiselect-container" [class.is-open]="isStatusOpen()">
            <div class="multiselect-trigger" (click)="toggleStatusDropdown()">
                <span>{{ statusLabel() }}</span>
                <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>

            @if (isStatusOpen()) {
                <div class="multiselect-dropdown">
                    @for (opt of statusOptions; track opt.value) {
                        <label class="checkbox-label"
                               [class.checked]="this.selectedStatuses().includes(opt.value)"
                        >
                            <input
                                    type="checkbox"
                                    [value]="opt.value"
                                    [checked]="selectedStatuses().includes(opt.value)"
                                    (change)="onStatusChange(opt.value, $event)"
                            />
                            <span>{{ opt.label }}</span>
                        </label>
                    }
                </div>
            }
        </div>

        <div class="multiselect-container" [class.is-open]="isTypesOpen()">
            <div class="multiselect-trigger" (click)="toggleTypeDropdown()">
                <span>{{ typesLabel() }}</span>
                <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>

            @if (isTypesOpen()) {
                <div class="multiselect-dropdown">
                    @for (opt of typesOptions; track opt.value) {
                        <label class="checkbox-label"
                            [class.checked]="this.selectedTypes().includes(opt.value)"
                        >
                            <input
                                    type="checkbox"
                                    [value]="opt.value"
                                    [checked]="selectedTypes().includes(opt.value)"
                                    (change)="onTypeChange(opt.value, $event)"
                            />
                            <span>{{ opt.label }}</span>
                        </label>
                    }
                </div>
            }
        </div>

    </div>
</div>
