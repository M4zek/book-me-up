<div class="offer-item-container">
    <div class="desc-container">
        <p class="offer-title-paragraph">{{offerItem.name}}</p>
        <p class="offer-description-paragraph">{{offerItem.description}}</p>
    </div>
    <div class="price-time-container">
        <p class="offer-price-paragraph">{{offerItem.price | number: '1.2-2'}} PLN</p>
        <p class="offer-duration-paragraph">{{offerItem.duration}} min</p>
    </div>
</div>
