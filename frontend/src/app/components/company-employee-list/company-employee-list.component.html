<div class="company-employees">
    <p class="title-employees">Employees</p>
    <div class="employees">
        <div class="employee" *ngFor="let employee of companyEmployees">
            <app-my-img [src]="employee.avatar"
                        [alt]="'avatar'"
                        [type]="FileType.IMG_USER_AVATAR"
            />
            <p class="employee-name-paragraph">{{employee.firstName}} {{employee.lastName}}</p>
        </div>
    </div>
</div>
