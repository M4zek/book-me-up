<div class="stars">
    <ng-container
            *ngFor="let star of stars, let i = index"
    >
        <svg viewBox="0 0 24 24" class="star"
        (click)="setRating(i + 1)"
        >
            <defs>
                <linearGradient [attr.id]="'grad' + star">
                    <stop [attr.offset]="getStarFill(star) + '%'" stop-color="gold"/>
                    <stop [attr.offset]="getStarFill(star) + '%'" stop-color="rgba(255, 255, 255, 0.2)"/>
                </linearGradient>
            </defs>
            <polygon
                    points="12,2 15,9 22,9 17,14 18,21 12,17 6,21 7,14 2,9 9,9"
                    [attr.fill]="'url(#grad' + star + ')'"
            />
        </svg>
    </ng-container>
</div>
