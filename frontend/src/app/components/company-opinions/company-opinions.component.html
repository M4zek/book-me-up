<div class="opinions-main-container">
    <h2>Opinions</h2>
    <div class="star-container">
        <div class="overall-opinions">
            <p class="overall-value-opinion">{{opinionsDetails.rating | number:'1.1-1'}} / 5</p>
            <app-rating-stars [rating]="opinionsDetails.rating"></app-rating-stars>
            <p class="overall-number-value">Based on {{opinionsDetails.totalReviews}} opinions</p>
        </div>
        <div class="detailed-opinions">
            <div class="bar"
                 *ngFor="let rating of this.opinionsDetails.ratingCounts | keyvalue">
                    <app-rating-bar [rating]="+rating.key" [count]="rating.value" [total]="opinionsDetails.totalReviews"/>
            </div>
        </div>
    </div>
    <div class="checkbox-wrapper">
        <input type="checkbox" class="sc-gJwTLC ikxBAC" (change)="onShowUserOpinionsListChange($event)">
        <p>Show user opinions</p>
    </div>
    <div class="container-list"
    [class.show]="showUserOpinionsList">
        <app-user-opinions-list></app-user-opinions-list>
    </div>
</div>
