<div class="user-card">
    <div class="table-scroll-container">
        <table class="user-table">
            <tbody>
                @if (isLoading) {
                    @let skeletons = [1, 2, 3, 4];
                    @for (s of skeletons; track s) {
                        <tr>
                            <td>
                                <div class="user-info">
                                    <div class="skeleton skeleton-avatar"></div>
                                    <div class="skeleton skeleton-text skeleton-name"></div>
                                </div>
                            </td>
                            <td class="col-date">
                                <div class="skeleton skeleton-text skeleton-date"></div>
                            </td>
                        </tr>
                    }
                } @else {
                    @for (user of users?.content; track user) {
                        <tr>
                            <td>
                                <div class="user-info">
                                    @if (user.avatarUrl) {
                                        <img [src]="user.avatarUrl" alt="Avatar" class="user-avatar">
                                    } @else {
                                        <div class="avatar-placeholder">{{ getInitials(user.name) }}</div>
                                    }
                                    <span>{{user.name}}</span>
                                </div>
                            </td>
                            <td class="col-date">{{getTimeAgo(user.createdAt)}}</td>
                        </tr>
                    } @empty {
                        <div class="user-info">
                            <span>No data</span>
                        </div>
                    }
                }
            </tbody>
        </table>
    </div>
</div>
